name: PR build checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  node-quick:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build guard tests
            test: .github/verify-portable-ggml.test.cjs
          - name: Issue workflow tests
            test: .github/scripts/issue-workflows.test.cjs
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test '${{ matrix.test }}'

  benchmark-tests:
    name: Diarization benchmark tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s diarization-sidecar/Benchmarks -p 'test_*.py' -v

  funasr-tests:
    name: FUN-ASR embedding tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          c++ -std=c++17 funasr-helper/tests/audio_embeddings.cpp -o "$RUNNER_TEMP/funasr-embedding-tests"
          "$RUNNER_TEMP/funasr-embedding-tests"

  frontend-tests:
    name: Frontend unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - working-directory: frontend
        run: bash ../.github/scripts/test-frontend.sh

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - working-directory: frontend
        run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/out
          if-no-files-found: error
          retention-days: 3

  browser-tests:
    name: Browser release tests
    needs: frontend-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/out
      - working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium webkit
      - working-directory: frontend
        run: pnpm test:release --grep-invert "normal session:"
      - name: Save browser failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-release-test-failures
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 3

  # Run all macOS builds and tests on a single macos-latest runner.
  # GitHub hosted macOS arm64 pools experience capacity constraints and cancel
  # queued jobs that fail to acquire a runner after ~15 minutes, and standard
  # accounts are capped at 5 concurrent macOS jobs. Consolidating avoids
  # multi-VM fan-out, redundant Rust/helper builds, and mid-run cancellations.
  macos-app:
    name: macOS build, tests, and launch
    needs: frontend-build
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - uses: ./.github/actions/setup-native
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/out
      - name: Swift interval tests
        run: |
          swiftc \
            diarization-sidecar/Sources/meetily-diarization/IntervalProcessing.swift \
            diarization-sidecar/Tests/IntervalProcessing/main.swift \
            -o "$RUNNER_TEMP/meetily-interval-tests"
          "$RUNNER_TEMP/meetily-interval-tests"
      - name: Llama helper unit tests
        env:
          # Keep the llama helper build separate from the restored app target,
          # while sharing compiled artifacts between its tests and release binary.
          CARGO_TARGET_DIR: ${{ runner.temp }}/llama-helper
        run: cargo test --locked --release -p llama-helper --features metal
      - name: Build llama helper
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/llama-helper
        run: |
          cargo build --locked --release -p llama-helper --features metal
          mkdir -p frontend/src-tauri/binaries
          cp "$CARGO_TARGET_DIR/release/llama-helper" frontend/src-tauri/binaries/llama-helper-aarch64-apple-darwin
      - name: Build diarization helper
        run: node frontend/scripts/build-diarization-sidecar.js
      - name: Build FUN-ASR helper
        run: node frontend/scripts/build-funasr-sidecar.js
      - name: Bundle the release app
        working-directory: frontend
        # Use the frontend and helpers built above. Do not build a DMG.
        run: pnpm exec tauri build --ci --bundles app --config '{"build":{"beforeBuildCommand":""}}' -- --locked
      - name: Verify and archive the app
        run: |
          app="target/release/bundle/macos/Meetily Branch.app"
          test -d "$app"
          lipo "$app/Contents/MacOS/meetily" -verify_arch arm64
          codesign --verify --deep --strict "$app"
          # A single archive keeps executable permissions and framework symlinks.
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/meetily-macos-arm64.app.zip"
      - name: Upload macOS app bundle
        uses: actions/upload-artifact@v4
        with:
          name: meetily-macos-arm64-app
          path: ${{ runner.temp }}/meetily-macos-arm64.app.zip
          if-no-files-found: error
          retention-days: 3
      - name: Rust lib tests
        run: cargo test --locked --release -p meetily --lib
      - name: Rust doc tests
        run: cargo test --locked --release -p meetily --doc
      - name: Unpack the release app
        run: ditto -x -k "$RUNNER_TEMP/meetily-macos-arm64.app.zip" "$RUNNER_TEMP/meetily-app"
      - name: Install the UI test project generator
        run: brew list --versions xcodegen >/dev/null || brew install xcodegen
      - name: Launch the app and use its setup page
        id: app-walkthrough
        run: bash .github/scripts/test-macos-app.sh
      - name: Save native test results
        if: always() && steps.app-walkthrough.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-launch-results
          path: |
            ${{ runner.temp }}/meetily-launch/Launch.xcresult
            ${{ runner.temp }}/meetily-launch/*.log
            ${{ runner.temp }}/meetily-launch/*.sample.txt
          if-no-files-found: ignore
          retention-days: 3

  browser-walkthrough:
    name: Normal usage walkthrough (browser)
    needs: frontend-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/out
      - working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium webkit
      - working-directory: frontend
        run: pnpm test:release normal-usage.spec.ts
      - name: Save walkthrough failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: normal-usage-test-failures
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 3
