name: PR build checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  node-quick:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build guard tests
            test: .github/verify-portable-ggml.test.cjs
          - name: Issue workflow tests
            test: .github/scripts/issue-workflows.test.cjs
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test '${{ matrix.test }}'

  benchmark-tests:
    name: Diarization benchmark tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s diarization-sidecar/Benchmarks -p 'test_*.py' -v

  funasr-tests:
    name: FUN-ASR embedding tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          c++ -std=c++17 funasr-helper/tests/audio_embeddings.cpp -o "$RUNNER_TEMP/funasr-embedding-tests"
          "$RUNNER_TEMP/funasr-embedding-tests"

  frontend-tests:
    name: Frontend unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - working-directory: frontend
        run: bash ../.github/scripts/test-frontend.sh

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - working-directory: frontend
        run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/out
          if-no-files-found: error
          retention-days: 3

  browser-tests:
    name: Browser release tests
    needs: frontend-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/out
      - working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium webkit
      - working-directory: frontend
        run: pnpm test:release --grep-invert "normal session:"
      - name: Save browser failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-release-test-failures
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 3

  # Run all macOS builds and tests on a single macos-latest runner.
  # GitHub hosted macOS arm64 pools experience capacity constraints and cancel
  # queued jobs that fail to acquire a runner after ~15 minutes, and standard
  # accounts are capped at 5 concurrent macOS jobs. Consolidating avoids
  # multi-VM fan-out, redundant Rust/helper builds, and mid-run cancellations.
  macos-app:
    name: macOS build, tests, and launch
    needs: frontend-build
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - uses: ./.github/actions/setup-native
      - id: download-frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/out
      - name: Swift interval tests
        id: swift-tests
        continue-on-error: true
        run: |
          swiftc \
            diarization-sidecar/Sources/meetily-diarization/IntervalProcessing.swift \
            diarization-sidecar/Tests/IntervalProcessing/main.swift \
            -o "$RUNNER_TEMP/meetily-interval-tests"
          "$RUNNER_TEMP/meetily-interval-tests"
      - name: Llama helper unit tests
        id: llama-tests
        continue-on-error: true
        env:
          # Keep the llama helper build separate from the restored app target,
          # while sharing compiled artifacts between its tests and release binary.
          CARGO_TARGET_DIR: ${{ runner.temp }}/llama-helper
        run: cargo test --locked --release -p llama-helper --features metal
      - name: Build llama helper
        id: build-llama
        continue-on-error: true
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/llama-helper
        run: |
          cargo build --locked --release -p llama-helper --features metal
          mkdir -p frontend/src-tauri/binaries
          cp "$CARGO_TARGET_DIR/release/llama-helper" frontend/src-tauri/binaries/llama-helper-aarch64-apple-darwin
      - name: Build diarization helper
        id: build-diarization
        continue-on-error: true
        run: node frontend/scripts/build-diarization-sidecar.js
      - name: Build FUN-ASR helper
        id: build-funasr
        continue-on-error: true
        run: node frontend/scripts/build-funasr-sidecar.js
      - name: Bundle the release app
        id: bundle-app
        if: success() && steps.build-llama.outcome == 'success' && steps.build-diarization.outcome == 'success' && steps.build-funasr.outcome == 'success'
        continue-on-error: true
        working-directory: frontend
        # Use the frontend and helpers built above. Do not build a DMG.
        run: pnpm exec tauri build --ci --bundles app --config '{"build":{"beforeBuildCommand":""}}' -- --locked
      - name: Verify and archive the app
        id: verify-app
        if: success() && steps.bundle-app.outcome == 'success'
        continue-on-error: true
        run: |
          app="target/release/bundle/macos/Meetily Branch.app"
          test -d "$app"
          lipo "$app/Contents/MacOS/meetily" -verify_arch arm64
          codesign --verify --deep --strict "$app"
          # A single archive keeps executable permissions and framework symlinks.
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/meetily-macos-arm64.app.zip"
      - name: Upload macOS app bundle
        id: upload-app
        if: success() && steps.verify-app.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: meetily-macos-arm64-app
          path: ${{ runner.temp }}/meetily-macos-arm64.app.zip
          if-no-files-found: error
          retention-days: 3
      - name: Rust lib tests
        id: rust-lib-tests
        if: success() && steps.build-llama.outcome == 'success' && steps.build-diarization.outcome == 'success' && steps.build-funasr.outcome == 'success'
        continue-on-error: true
        run: cargo test --locked --release -p meetily --lib
      - name: Rust doc tests
        id: rust-doc-tests
        if: success() && steps.build-llama.outcome == 'success' && steps.build-diarization.outcome == 'success' && steps.build-funasr.outcome == 'success'
        continue-on-error: true
        run: cargo test --locked --release -p meetily --doc
      - name: Unpack the release app
        id: unpack-app
        if: success() && steps.verify-app.outcome == 'success'
        continue-on-error: true
        run: ditto -x -k "$RUNNER_TEMP/meetily-macos-arm64.app.zip" "$RUNNER_TEMP/meetily-app"
      - name: Install the UI test project generator
        id: install-xcodegen
        if: success() && steps.unpack-app.outcome == 'success'
        continue-on-error: true
        run: brew list --versions xcodegen >/dev/null || brew install xcodegen
      - name: Launch the app and use its setup page
        id: app-walkthrough
        if: success() && steps.unpack-app.outcome == 'success' && steps.install-xcodegen.outcome == 'success'
        continue-on-error: true
        run: bash .github/scripts/test-macos-app.sh
      - name: Save native test results
        if: always() && steps.app-walkthrough.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-launch-results
          path: |
            ${{ runner.temp }}/meetily-launch/Launch.xcresult
            ${{ runner.temp }}/meetily-launch/*.log
            ${{ runner.temp }}/meetily-launch/*.sample.txt
          if-no-files-found: ignore
          retention-days: 3
      - name: Check macOS step outcomes
        if: "!cancelled() && steps.download-frontend.outcome == 'success'"
        env:
          OUTCOME_SWIFT_TESTS: ${{ steps.swift-tests.outcome }}
          OUTCOME_LLAMA_TESTS: ${{ steps.llama-tests.outcome }}
          OUTCOME_BUILD_LLAMA: ${{ steps.build-llama.outcome }}
          OUTCOME_BUILD_DIARIZATION: ${{ steps.build-diarization.outcome }}
          OUTCOME_BUILD_FUNASR: ${{ steps.build-funasr.outcome }}
          OUTCOME_BUNDLE_APP: ${{ steps.bundle-app.outcome }}
          OUTCOME_VERIFY_APP: ${{ steps.verify-app.outcome }}
          OUTCOME_UPLOAD_APP: ${{ steps.upload-app.outcome }}
          OUTCOME_RUST_LIB_TESTS: ${{ steps.rust-lib-tests.outcome }}
          OUTCOME_RUST_DOC_TESTS: ${{ steps.rust-doc-tests.outcome }}
          OUTCOME_UNPACK_APP: ${{ steps.unpack-app.outcome }}
          OUTCOME_INSTALL_XCODEGEN: ${{ steps.install-xcodegen.outcome }}
          OUTCOME_APP_WALKTHROUGH: ${{ steps.app-walkthrough.outcome }}
        run: |
          failed=()
          check_outcome() {
            local label="$1"
            local outcome="$2"
            if [[ "$outcome" != "success" && "$outcome" != "skipped" ]]; then
              echo "::error::Step failed: $label (outcome: ${outcome:-unknown})"
              failed+=("$label")
            fi
          }
          check_outcome "Swift interval tests" "$OUTCOME_SWIFT_TESTS"
          check_outcome "Llama helper unit tests" "$OUTCOME_LLAMA_TESTS"
          check_outcome "Build llama helper" "$OUTCOME_BUILD_LLAMA"
          check_outcome "Build diarization helper" "$OUTCOME_BUILD_DIARIZATION"
          check_outcome "Build FUN-ASR helper" "$OUTCOME_BUILD_FUNASR"
          check_outcome "Bundle the release app" "$OUTCOME_BUNDLE_APP"
          check_outcome "Verify and archive the app" "$OUTCOME_VERIFY_APP"
          check_outcome "Upload macOS app bundle" "$OUTCOME_UPLOAD_APP"
          check_outcome "Rust lib tests" "$OUTCOME_RUST_LIB_TESTS"
          check_outcome "Rust doc tests" "$OUTCOME_RUST_DOC_TESTS"
          check_outcome "Unpack the release app" "$OUTCOME_UNPACK_APP"
          check_outcome "Install the UI test project generator" "$OUTCOME_INSTALL_XCODEGEN"
          check_outcome "Launch the app and use its setup page" "$OUTCOME_APP_WALKTHROUGH"
          if (( ${#failed[@]} > 0 )); then
            echo "Failed macOS steps:"
            printf ' - %s\n' "${failed[@]}"
            exit 1
          fi

  browser-walkthrough:
    name: Normal usage walkthrough (browser)
    needs: frontend-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/out
      - working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium webkit
      - working-directory: frontend
        run: pnpm test:release normal-usage.spec.ts
      - name: Save walkthrough failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: normal-usage-test-failures
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 3
