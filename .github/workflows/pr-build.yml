name: PR build checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Run frontend tests
        run: bash scripts/test-frontend.sh
      - name: Build frontend for production
        working-directory: frontend
        run: pnpm build
      - name: Save frontend output for the native build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/out
          if-no-files-found: error
          retention-days: 3

  macos:
    name: macOS release build and test compilation
    needs: frontend
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: pr-macos-release
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/out
      - name: Configure OpenSSL
        run: |
          brew list --versions openssl@3 >/dev/null || brew install openssl@3
          openssl_prefix=$(brew --prefix openssl@3)
          echo "OPENSSL_DIR=$openssl_prefix" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$openssl_prefix" >> "$GITHUB_ENV"
      - name: Build the local summary helper
        run: |
          cargo build --locked --release -p llama-helper --features metal
          mkdir -p frontend/src-tauri/binaries
          cp target/release/llama-helper frontend/src-tauri/binaries/llama-helper-aarch64-apple-darwin
      # PR #23 adds this helper. Build it when that feature is present.
      - name: Build the local speaker helper
        if: ${{ hashFiles('frontend/scripts/build-diarization-sidecar.js') != '' }}
        run: node frontend/scripts/build-diarization-sidecar.js
      - name: Build the app in release mode
        run: cargo build --locked --release -p meetily
      - name: Compile Rust unit tests
        run: cargo test --locked --release -p meetily --lib --no-run
