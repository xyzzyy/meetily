name: PR build checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Run build guard tests
        run: node --test .github/verify-portable-ggml.test.cjs
      - name: Run frontend tests
        working-directory: frontend
        run: |
          set -euo pipefail
          test_list=$(mktemp)
          trap 'rm -f "$test_list"' EXIT
          if ! find tests -type f \( -name '*.test.mjs' -o -name '*.test.js' -o -name '*.test.ts' -o -name '*.test.tsx' \) -print0 > "$test_list"; then
            echo "Failed to discover frontend tests." >&2
            exit 1
          fi
          if [[ ! -s "$test_list" ]]; then
            echo "No frontend test files found." >&2
            exit 1
          fi
          while IFS= read -r -d '' test_file; do
            if grep -q 'bun:test' "$test_file"; then
              bun test "./$test_file"
            else
              node --test "$test_file"
            fi
          done < "$test_list"
      - name: Build frontend for production
        working-directory: frontend
        run: pnpm build
      - name: Save frontend output for the native build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/out
          if-no-files-found: error
          retention-days: 3

  macos:
    name: macOS release build and tests
    needs: frontend
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Read the active Xcode version
        id: xcode
        run: echo "version=$(xcodebuild -version | head -n 1 | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: pr-macos-release-${{ steps.xcode.outputs.version }}
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/out
      - name: Configure the active Xcode SDK
        run: |
          xcodebuild -version
          sdk_path=$(xcrun --sdk macosx --show-sdk-path)
          test -d "$sdk_path"
          echo "SDKROOT=$sdk_path" >> "$GITHUB_ENV"
      - name: Configure OpenSSL
        run: |
          brew list --versions openssl@3 >/dev/null || brew install openssl@3
          openssl_prefix=$(brew --prefix openssl@3)
          echo "OPENSSL_DIR=$openssl_prefix" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$openssl_prefix" >> "$GITHUB_ENV"
      - name: Build the local summary helper
        run: |
          cargo build --locked --release -p llama-helper --features metal
          mkdir -p frontend/src-tauri/binaries
          cp target/release/llama-helper frontend/src-tauri/binaries/llama-helper-aarch64-apple-darwin
      # PR #23 adds this helper. Build it when that feature is present.
      - name: Build the local speaker helper
        if: ${{ hashFiles('frontend/scripts/build-diarization-sidecar.js') != '' }}
        run: node frontend/scripts/build-diarization-sidecar.js
      - name: Build the app in release mode
        run: cargo build --locked --release -p meetily
      - name: Run Rust unit tests
        run: cargo test --locked --release -p meetily --lib
      - name: Run llama helper tests
        run: cargo test --locked --release -p llama-helper --features metal
