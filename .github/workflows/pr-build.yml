name: PR build checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  node-quick:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build guard tests
            test: .github/verify-portable-ggml.test.cjs
          - name: Issue workflow tests
            test: .github/scripts/issue-workflows.test.cjs
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test '${{ matrix.test }}'

  benchmark-tests:
    name: Diarization benchmark tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s diarization-sidecar/Benchmarks -p 'test_*.py' -v

  funasr-tests:
    name: FUN-ASR embedding tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          c++ -std=c++17 funasr-helper/tests/audio_embeddings.cpp -o "$RUNNER_TEMP/funasr-embedding-tests"
          "$RUNNER_TEMP/funasr-embedding-tests"

  swift-tests:
    name: Swift interval tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          swiftc \
            diarization-sidecar/Sources/meetily-diarization/IntervalProcessing.swift \
            diarization-sidecar/Tests/IntervalProcessing/main.swift \
            -o "$RUNNER_TEMP/meetily-interval-tests"
          "$RUNNER_TEMP/meetily-interval-tests"

  frontend-tests:
    name: Frontend unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - working-directory: frontend
        run: bash ../.github/scripts/test-frontend.sh

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - working-directory: frontend
        run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/out
          if-no-files-found: error
          retention-days: 3

  browser-tests:
    name: Browser release tests
    needs: frontend-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/out
      - working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium webkit
      - working-directory: frontend
        run: pnpm test:release --grep-invert "normal session:"
      - name: Save browser failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-release-test-failures
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 3

  native-helpers:
    name: Build ${{ matrix.helper }} helper
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        helper: [llama, diarization, funasr]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ./.github/actions/setup-native
        with:
          openssl: ${{ matrix.helper == 'llama' }}
      - name: Build llama helper
        if: matrix.helper == 'llama'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/llama-helper-build
        run: |
          cargo build --locked --release -p llama-helper --features metal
          mkdir -p frontend/src-tauri/binaries
          cp "$CARGO_TARGET_DIR/release/llama-helper" frontend/src-tauri/binaries/llama-helper-aarch64-apple-darwin
      - name: Build diarization helper
        if: matrix.helper == 'diarization'
        run: node frontend/scripts/build-diarization-sidecar.js
      - name: Build FUN-ASR helper
        if: matrix.helper == 'funasr'
        run: node frontend/scripts/build-funasr-sidecar.js
      - name: Archive executable helper
        env:
          HELPER: ${{ matrix.helper }}
        run: |
          if [[ "$HELPER" == diarization ]]; then
            binary=meetily-diarization-aarch64-apple-darwin
          else
            binary="$HELPER-helper-aarch64-apple-darwin"
          fi
          tar -czf "$RUNNER_TEMP/$HELPER.tar.gz" -C frontend/src-tauri/binaries "$binary"
      - uses: actions/upload-artifact@v4
        with:
          name: native-helper-${{ matrix.helper }}
          path: ${{ runner.temp }}/${{ matrix.helper }}.tar.gz
          if-no-files-found: error
          retention-days: 3

  rust-tests:
    name: Rust unit and doc tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native
        with:
          cache-key: pr-macos-rust-tests
      - name: Prepare build stubs
        run: |
          mkdir -p frontend/out frontend/src-tauri/binaries
          printf '<!doctype html><title>test</title>\n' > frontend/out/index.html
          for bin in llama-helper meetily-diarization funasr-helper; do
            target_bin="frontend/src-tauri/binaries/${bin}-aarch64-apple-darwin"
            printf '#!/bin/sh\nexit 0\n' > "$target_bin"
            chmod +x "$target_bin"
          done
      - run: cargo test --locked --release -p meetily --lib
      - if: ${{ !cancelled() }}
        run: cargo test --locked --release -p meetily --doc

  llama-tests:
    name: Llama helper unit tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native
        with:
          openssl: 'true'
      - run: cargo test --locked --release -p llama-helper --features metal
        env:
          # Keep this test build separate from the restored app build artifacts.
          CARGO_TARGET_DIR: ${{ runner.temp }}/llama-helper-tests

  macos-app:
    name: macOS app bundle and launch
    needs: [frontend-build, native-helpers]
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native
        with:
          cache-key: pr-macos-release
      - uses: ./.github/actions/native-inputs
      - name: Install Tauri CLI
        # Keep aligned with @tauri-apps/cli in frontend/pnpm-lock.yaml.
        run: |
          curl -fsSL https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.11.1/cargo-tauri-aarch64-apple-darwin.zip -o "$RUNNER_TEMP/cargo-tauri.zip"
          echo "05bcd0ed31f293895963864068d8d2c0f964d98aa959de344d24b644bdce9e12  $RUNNER_TEMP/cargo-tauri.zip" | shasum -a 256 -c -
          mkdir -p "$HOME/.cargo/bin"
          unzip -o -j "$RUNNER_TEMP/cargo-tauri.zip" cargo-tauri -d "$HOME/.cargo/bin"
          chmod +x "$HOME/.cargo/bin/cargo-tauri"
      - name: Bundle the release app
        working-directory: frontend
        # Use the frontend and helpers from their own checks. Do not build a DMG.
        run: cargo tauri build --ci --bundles app --config '{"build":{"beforeBuildCommand":""}}' -- --locked
      - name: Verify and archive the app
        run: |
          app="target/release/bundle/macos/Meetily Branch.app"
          test -d "$app"
          lipo "$app/Contents/MacOS/meetily" -verify_arch arm64
          codesign --verify --deep --strict "$app"
          # A single archive keeps executable permissions and framework symlinks.
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/meetily-macos-arm64.app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: meetily-macos-arm64-app
          path: ${{ runner.temp }}/meetily-macos-arm64.app.zip
          if-no-files-found: error
          retention-days: 3
      - name: Unpack the release app
        run: ditto -x -k "$RUNNER_TEMP/meetily-macos-arm64.app.zip" "$RUNNER_TEMP/meetily-app"
      - name: Install the UI test project generator
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew list --versions xcodegen >/dev/null || brew install xcodegen
      - name: Launch the app and use its setup page
        run: env -u SDKROOT bash .github/scripts/test-macos-app.sh
      - name: Save native test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-launch-results
          path: |
            ${{ runner.temp }}/meetily-launch/Launch.xcresult
            ${{ runner.temp }}/meetily-launch/*.log
            ${{ runner.temp }}/meetily-launch/*.sample.txt
          if-no-files-found: ignore
          retention-days: 3

  browser-walkthrough:
    name: Normal usage walkthrough (browser)
    needs: frontend-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/out
      - working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium webkit
      - working-directory: frontend
        run: pnpm test:release normal-usage.spec.ts
      - name: Save walkthrough failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: normal-usage-test-failures
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 3
