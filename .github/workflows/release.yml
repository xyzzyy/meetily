name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Manual runs and tag pushes must not publish the same version at once.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  macos-app:
    name: Release macOS DMG (Apple Silicon)
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check release version and tag
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { execFileSync } = require('node:child_process');
            const config = JSON.parse(fs.readFileSync('frontend/src-tauri/tauri.conf.json', 'utf8'));
            const version = config.version;
            if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
              throw new Error('Set a stable X.Y.Z version in tauri.conf.json before release.');
            }
            const tag = `v${version}`;
            const sha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
            if (context.ref.startsWith('refs/tags/') && context.ref !== `refs/tags/${tag}`) {
              throw new Error(`The tag must match the app version: ${tag}`);
            }
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            try {
              const existing = await github.rest.repos.getCommit({ ...repo, ref: `tags/${tag}` });
              if (existing.data.sha !== sha) {
                throw new Error(`${tag} points to a different commit. Update the app version.`);
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            try {
              await github.rest.repos.getReleaseByTag({ ...repo, tag });
              throw new Error(`Release ${tag} already exists. Remove an incomplete draft before retrying.`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            core.setOutput('tag', tag);
            core.setOutput('sha', sha);
            core.setOutput('title', `${config.productName} ${tag}`);

      - uses: ./.github/actions/setup-frontend
      - uses: ./.github/actions/setup-native

      - name: Build llama helper with Metal
        run: |
          cargo build --locked --release -p llama-helper --features metal
          mkdir -p frontend/src-tauri/binaries
          cp target/release/llama-helper frontend/src-tauri/binaries/llama-helper-aarch64-apple-darwin

      - name: Build app and DMG
        working-directory: frontend
        # beforeBuildCommand builds the diarization and FUN-ASR helpers and the UI.
        run: pnpm exec tauri build --ci --bundles app,dmg -- --locked

      - name: Verify app and DMG
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          app="target/release/bundle/macos/Meetily Branch.app"
          test -d "$app"
          lipo "$app/Contents/MacOS/meetily" -verify_arch arm64
          codesign --verify --deep --strict "$app"
          for helper in llama-helper ffmpeg meetily-diarization funasr-helper; do
            test -x "$app/Contents/MacOS/$helper"
          done
          shopt -s nullglob
          dmgs=(target/release/bundle/dmg/*.dmg)
          if [[ ${#dmgs[@]} -ne 1 ]]; then
            echo 'Expected one DMG.' >&2
            exit 1
          fi
          hdiutil verify "${dmgs[0]}"
          mkdir -p dist
          cp "${dmgs[0]}" "dist/Meetily-Branch-${RELEASE_TAG}-macos-arm64.dmg"
          cd dist
          shasum -a 256 ./*.dmg > SHA256SUMS

      - name: Save release files
        uses: actions/upload-artifact@v4
        with:
          name: meetily-branch-macos-arm64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
        run: |
          # Keep the release in draft until all files have been uploaded.
          gh release create "$RELEASE_TAG" dist/* \
            --target "$RELEASE_SHA" \
            --title "$RELEASE_TITLE" \
            --notes 'Apple Silicon Macs with macOS 14.4 or later. This app has an ad hoc signature. It is not notarized by Apple; macOS can block the first launch.' \
            --generate-notes --draft
          gh release edit "$RELEASE_TAG" --draft=false
          release_url=$(gh release view "$RELEASE_TAG" --json url --jq .url)
          echo "Release: $release_url" >> "$GITHUB_STEP_SUMMARY"
