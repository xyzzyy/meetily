name: opencode-review

# Automatic PR review by OpenCode running inside this workflow's runner.
# Uses the OpenCode Console gateway. Swap `model` for any provider/model you have keys for.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Leave time after the review step to report a failure or timeout.
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Skipped until the OPENCODE_API_KEY secret is configured, so the check
      # stays green instead of failing on every pull request.
      - name: Run OpenCode review
        id: review
        if: ${{ env.OPENCODE_API_KEY != '' }}
        timeout-minutes: 20
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No terminal exists on a runner. Deny the two permissions that
          # otherwise default to "ask", so the review cannot wait forever on a
          # prompt. Denying an external path is reported to the model, which
          # then continues with the repository checkout.
          # A step limit lets the agent return its findings before the timeout.
          # Do not delegate more work or edit the checkout during a review.
          OPENCODE_CONFIG_CONTENT: >-
            {"permission":{"external_directory":"deny","doom_loop":"deny"},
             "agent":{"pr-review":{"mode":"primary","steps":12,
             "permission":{"task":"deny","edit":"deny"}}}}
        with:
          model: opencode/deepseek-v4.1-flash-free
          agent: pr-review
          use_github_token: true
          prompt: |
            Review this pull request.

            Report only real defects:
            - bugs and logic errors
            - security vulnerabilities
            - broken edge cases (null/empty input, error paths, concurrency)
            - resource leaks

            Cite the file and line for every finding, and explain concretely why it
            is wrong. Do not report style preferences, naming, or formatting.
            If you find nothing worth fixing, say so briefly.

            Inspect the changed code and its direct callers. Do not edit files,
            install dependencies, or run builds. Finish within 12 tool rounds.
            If the review is incomplete, state what you checked and what remains.

      - name: Report an incomplete review
        if: ${{ failure() && steps.review.outcome == 'failure' }}
        timeout-minutes: 2
        uses: actions/github-script@v7
        with:
          script: |
            const { reportIncompleteReview } = require('./.github/scripts/review-status.cjs');
            await reportIncompleteReview({ github, context });
