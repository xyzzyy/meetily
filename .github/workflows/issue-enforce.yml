name: issue-enforce

# Enforce the issue templates in .github/ISSUE_TEMPLATE/.
#
# Layer 1 of enforcement is the YAML issue forms themselves: the web UI refuses
# submission until every required field is filled, and config.yml removes the
# "open a blank issue" escape hatch.
#
# This workflow is layer 2 for issues created outside the web UI (API, CLI,
# bots, imports). On every opened, reopened, or edited issue authored by a
# non-maintainer it:
#   - recognizes the template from the [BUG]/[FEATURE]/[DOCS]/[QUESTION] title
#     prefix and auto-applies the matching label,
#   - requires that the template's mandatory section headings exist in the body.
#
# Non-conforming issues get an explanatory comment, the `invalid-template` label,
# and are closed immediately (warn + auto-close).
#
# Existing issues are grandfathered: nothing is backfilled, and an open issue is
# only re-evaluated after it is edited or reopened. The workflow never reopens
# a closed issue itself; closed issues stay closed and their authors are asked
# to resubmit through the form.
#
# Maintainer-authored issues (owner/member/collaborator) and events triggered by
# maintainers (owner/member/collaborator/triage) are exempt, so a maintainer's
# edit or manual reopen is never overridden by this workflow.

on:
  issues:
    types: [opened, reopened, edited]

concurrency:
  group: issue-enforce-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  enforce:
    if: github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Enforce issue templates
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const num = issue.number;
            const action = context.payload.action;

            // Closed issues are never processed (and never reopened): edits to
            // them do nothing; only a reopen event can bring one back.
            if (issue.state !== "open") {
              core.notice("Issue is closed; skipping enforcement.");
              return;
            }

            if (["OWNER", "MEMBER", "COLLABORATOR"].includes(issue.author_association)) {
              core.notice("Authored by a maintainer; skipping enforcement.");
              return;
            }

            // Read the live issue so the check runs against the current title,
            // body and state, not the snapshot from when this event was queued.
            const live = (await github.rest.issues.get({
              owner: owner, repo: repo, issue_number: num
            })).data;
            if (live.state !== "open") {
              core.notice("Issue is closed; skipping enforcement.");
              return;
            }

            // A maintainer's edit or manual reopen is a deliberate override,
            // not a reporter bypassing the templates. Skip events triggered by
            // maintainers (triage can reopen/label/close). On `opened` the
            // sender is the author, already covered above.
            if (action !== "opened") {
              const actor = context.actor;
              if (actor) {
                try {
                  const perm = await github.rest.repos.getCollaboratorPermissionLevel({
                    owner: owner, repo: repo, username: actor
                  });
                  if (["admin", "maintain", "write", "triage"].includes(perm.data.permission)) {
                    core.notice("Triggered by a maintainer (" + actor + "); skipping enforcement.");
                    return;
                  }
                } catch (e) {
                  // Not a collaborator or lookup unavailable: keep enforcing.
                }
              }
            }

            const TEMPLATES = {
              "[bug]": {
                name: "Bug Report", file: "bug_report.yml", label: "bug",
                required: ["Bug Description", "Current Behavior", "Expected Behavior", "Steps to Reproduce", "Environment"],
                checklist: ["I have described the issue clearly", "I have searched for similar issues"]
              },
              "[feature]": {
                name: "Feature Request", file: "feature_request.yml", label: "enhancement",
                required: ["Feature Description", "Upstream Work & Prior Art"],
                checklist: ["I have described the issue clearly", "I have searched for similar feature requests"]
              },
              "[docs]": {
                name: "Documentation", file: "documentation.yml", label: "documentation",
                required: ["Documentation Location", "Issue Type", "What's Wrong"],
                checklist: ["I have described the issue clearly", "I have searched for similar documentation issues"]
              },
              "[question]": {
                name: "Question", file: "question.yml", label: "question",
                required: ["What are you trying to do?", "What have you already tried?"],
                checklist: ["I have described the issue clearly"]
              }
            };

            const title = (live.title || "").toLowerCase();
            const body = live.body || "";
            const current = (live.labels || []).map(function (l) {
              return (l && (l.name || l)) || "";
            });
            // Set before any label changes so repeated non-conforming edits do
            // not spam the same guidance comment.
            const hadInvalidTemplateLabel = current.includes("invalid-template");

            let tpl = null;
            for (const prefix of Object.keys(TEMPLATES)) {
              if (title.startsWith(prefix)) {
                tpl = TEMPLATES[prefix];
                break;
              }
            }

            function escapeRegExp(s) {
              return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            }

            // Split the body into its `###` sections, ignoring headings that
            // appear inside fenced code blocks (logs often contain them).
            function parseSections(markdown) {
              const sections = new Map();
              let current = null;
              let fenceChar = null;
              for (const line of markdown.split(/\r?\n/)) {
                const fence = line.match(/^\s*(```+|~~~+)/);
                if (fence) {
                  if (!fenceChar) {
                    fenceChar = fence[1][0];
                  } else if (fence[1][0] === fenceChar) {
                    fenceChar = null;
                  }
                  if (current) sections.get(current).push(line);
                  continue;
                }
                if (!fenceChar) {
                  const heading = line.match(/^#{1,6}[ \t]+(.+?)[ \t]*$/);
                  if (heading) {
                    current = heading[1].trim();
                    if (!sections.has(current)) sections.set(current, []);
                    continue;
                  }
                }
                if (current) sections.get(current).push(line);
              }
              return sections;
            }

            function findSection(sections, heading) {
              const match = Array.from(sections.keys()).find(function (key) {
                return key.toLowerCase() === heading.toLowerCase();
              });
              return match === undefined ? null : sections.get(match).join("\n").trim();
            }

            function isBlankSection(content) {
              return content === null || content === "" || /^_no response_$/i.test(content);
            }

            function missingSections(t, sections) {
              const missing = [];
              for (const heading of t.required) {
                if (isBlankSection(findSection(sections, heading))) missing.push(heading);
              }
              return missing;
            }

            function uncheckedCheckboxes(t, sections) {
              const checklist = findSection(sections, "Checklist");
              if (checklist === null) return t.checklist.slice();
              const unchecked = [];
              for (const item of t.checklist) {
                const pattern = new RegExp(
                  "^[ \\t]*[-*+][ \\t]*\\[[xX]\\][ \\t]*" + escapeRegExp(item) + "[ \\t]*$", "m"
                );
                if (!pattern.test(checklist)) unchecked.push(item);
              }
              return unchecked;
            }

            function newIssueUrl(t) {
              return "https://github.com/" + owner + "/" + repo + "/issues/new?template=" + t.file;
            }

            async function addLabel(name) {
              if (current.includes(name)) return;
              try {
                await github.rest.issues.addLabels({ owner: owner, repo: repo, issue_number: num, labels: [name] });
              } catch (e) {
                if (name !== "invalid-template" || (e.status !== 404 && e.status !== 422)) throw e;
                // Self-contained fallback for forks that lack the label.
                try {
                  await github.rest.issues.createLabel({
                    owner: owner, repo: repo, name: name,
                    color: "d73a4a", description: "Issue does not follow its template"
                  });
                } catch (createError) {
                  if (createError.status !== 422) throw createError;
                }
                await github.rest.issues.addLabels({ owner: owner, repo: repo, issue_number: num, labels: [name] });
              }
              current.push(name);
            }

            async function removeLabelSafely(name) {
              if (!current.includes(name)) return;
              try {
                await github.rest.issues.removeLabel({ owner: owner, repo: repo, issue_number: num, name: name });
              } catch (e) {
                // Label already gone; nothing to do.
              }
              current.splice(current.indexOf(name), 1);
            }

            async function commentOnce(msg) {
              if (hadInvalidTemplateLabel) {
                core.notice("Issue was already flagged earlier; skipping duplicate comment.");
                return;
              }
              await github.rest.issues.createComment({ owner: owner, repo: repo, issue_number: num, body: msg });
            }

            async function closeAsNotPlanned() {
              await github.rest.issues.update({
                owner: owner, repo: repo, issue_number: num,
                state: "closed", state_reason: "not_planned"
              });
            }

            if (!tpl) {
              core.notice("No template title prefix recognized; labeling and closing.");
              await addLabel("invalid-template");
              const chooser = Object.keys(TEMPLATES).map(function (prefix) {
                const t = TEMPLATES[prefix];
                return "- `" + prefix.toUpperCase() + "` — [" + t.name + "](" + newIssueUrl(t) + ")";
              }).join("\n");
              const msg =
                "Thanks for opening an issue! I could not match it to one of our " +
                "issue templates (the title should start with `[BUG]`, `[FEATURE]`, " +
                "`[DOCS]`, or `[QUESTION]` and the body should contain that " +
                "template's sections).\n\n" +
                "This issue has been closed. Editing it does not reopen it — " +
                "please open a new issue through one of the forms below, or ask a " +
                "maintainer to reopen this one if appropriate:\n\n" + chooser + "\n\n" +
                "Maintainer-authored issues are exempt from this check.";
              await commentOnce(msg);
              await closeAsNotPlanned();
              return;
            }

            const sections = parseSections(body);
            const missing = missingSections(tpl, sections);
            const unchecked = uncheckedCheckboxes(tpl, sections);
            if (missing.length === 0 && unchecked.length === 0) {
              core.notice("Issue follows the " + tpl.name + " template.");
              await addLabel(tpl.label);
              await removeLabelSafely("invalid-template");
              return;
            }

            core.notice(
              "Template violations" +
              (missing.length ? " - missing sections: " + missing.join(", ") : "") +
              (unchecked.length ? " - unchecked boxes: " + unchecked.join(", ") : "")
            );
            await addLabel("invalid-template");
            const problems = [];
            if (missing.length) {
              problems.push(
                "I could not find content under the required section(s) " +
                missing.map(function (h) {
                  return "`### " + h + "`";
                }).join(", ") + "."
              );
            }
            if (unchecked.length) {
              problems.push(
                "The following required checkbox(es) are not checked: " +
                unchecked.map(function (item) {
                  return "`" + item + "`";
                }).join(", ") + "."
              );
            }
            const msg =
              "Thanks for opening an issue! This one does not follow the " +
              "[" + tpl.name + "](" + newIssueUrl(tpl) + ") template.\n\n" +
              problems.join("\n\n") + "\n\n" +
              "This issue has been closed. Editing it does not reopen it — " +
              "please open a new issue through the [" + tpl.name + "](" + newIssueUrl(tpl) + ") " +
              "form and include the missing information, or ask a maintainer to reopen " +
              "this issue if appropriate.\n\n" +
              "Maintainer-authored issues are exempt from this check.";
            await commentOnce(msg);
            await closeAsNotPlanned();
