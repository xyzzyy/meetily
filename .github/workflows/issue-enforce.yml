name: issue-enforce

# Enforce the issue templates in .github/ISSUE_TEMPLATE/.
#
# Layer 1 of enforcement is the YAML issue forms themselves: the web UI refuses
# submission until every required field is filled, and config.yml removes the
# "open a blank issue" escape hatch.
#
# This workflow is layer 2 for issues created outside the web UI (API, CLI,
# bots, imports). On every opened, reopened, or edited issue authored by a
# non-maintainer it:
#   - recognizes the template from the [BUG]/[FEATURE]/[DOCS]/[QUESTION] title
#     prefix and auto-applies the matching label,
#   - requires that the template's mandatory section headings exist in the body.
#
# Non-conforming issues get an explanatory comment, the `invalid` label, and are
# closed immediately (warn + auto-close).
#
# Existing issues are grandfathered: nothing is backfilled, and an open issue is
# only re-evaluated after it is edited or reopened. The workflow never reopens
# a closed issue itself; closed issues stay closed and their authors are asked
# to resubmit through the form.
#
# Maintainer-authored issues (owner/member/collaborator) and events triggered by
# maintainers (owner/member/collaborator/triage) are exempt, so a maintainer's
# edit or manual reopen is never overridden by this workflow.

on:
  issues:
    types: [opened, reopened, edited]

concurrency:
  group: issue-enforce-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Enforce issue templates
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const num = issue.number;

            if (["OWNER", "MEMBER", "COLLABORATOR"].includes(issue.author_association)) {
              core.notice("Authored by a maintainer; skipping enforcement.");
              return;
            }

            // A maintainer's edit or manual reopen is a deliberate override,
            // not a reporter bypassing the templates. Skip events triggered by
            // maintainers (triage can reopen/label/close).
            const actor = context.actor;
            if (actor) {
              try {
                const perm = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner: owner, repo: repo, username: actor
                });
                if (["admin", "maintain", "write", "triage"].includes(perm.data.permission)) {
                  core.notice("Triggered by a maintainer (" + actor + "); skipping enforcement.");
                  return;
                }
              } catch (e) {
                // Not a collaborator or lookup unavailable: keep enforcing.
              }
            }

            if (issue.state !== "open") {
              core.notice("Issue is closed; skipping enforcement.");
              return;
            }

            const TEMPLATES = {
              "[bug]": {
                name: "Bug Report", file: "bug_report.yml", label: "bug",
                required: ["Bug Description", "Current Behavior", "Expected Behavior", "Steps to Reproduce", "Environment"]
              },
              "[feature]": {
                name: "Feature Request", file: "feature_request.yml", label: "enhancement",
                required: ["Feature Description", "Upstream Work & Prior Art"]
              },
              "[docs]": {
                name: "Documentation", file: "documentation.yml", label: "documentation",
                required: ["Documentation Location", "Issue Type", "What's Wrong"]
              },
              "[question]": {
                name: "Question", file: "question.yml", label: "question",
                required: ["What are you trying to do?", "What have you already tried?"]
              }
            };

            const title = (issue.title || "").toLowerCase();
            const body = issue.body || "";
            const current = (issue.labels || []).map(function (l) {
              return (l && (l.name || l)) || "";
            });
            // Set before any label changes so repeated non-conforming edits do
            // not spam the same guidance comment.
            const hadInvalidLabel = current.includes("invalid");

            let tpl = null;
            for (const prefix of Object.keys(TEMPLATES)) {
              if (title.startsWith(prefix)) {
                tpl = TEMPLATES[prefix];
                break;
              }
            }

            function escapeRegExp(s) {
              return s.replace(/[.*+?^'"'{}()|[\]\\]/g, "\\$&");
            }

            function missingSections(t) {
              const missing = [];
              for (const heading of t.required) {
                const pattern = new RegExp("^#{1,6}[ \\t]+" + escapeRegExp(heading) + "[ \\t]*$", "im");
                if (!pattern.test(body)) missing.push(heading);
              }
              return missing;
            }

            function newIssueUrl(t) {
              return "https://github.com/" + owner + "/" + repo + "/issues/new?template=" + t.file;
            }

            async function addLabel(name) {
              if (current.includes(name)) return;
              await github.rest.issues.addLabels({ owner: owner, repo: repo, issue_number: num, labels: [name] });
              current.push(name);
            }

            async function removeLabelSafely(name) {
              if (!current.includes(name)) return;
              try {
                await github.rest.issues.removeLabel({ owner: owner, repo: repo, issue_number: num, name: name });
              } catch (e) {
                // Label already gone; nothing to do.
              }
              current.splice(current.indexOf(name), 1);
            }

            async function commentOnce(msg) {
              if (hadInvalidLabel) {
                core.notice("Issue was already flagged earlier; skipping duplicate comment.");
                return;
              }
              await github.rest.issues.createComment({ owner: owner, repo: repo, issue_number: num, body: msg });
            }

            async function closeAsNotPlanned() {
              await github.rest.issues.update({
                owner: owner, repo: repo, issue_number: num,
                state: "closed", state_reason: "not_planned"
              });
            }

            if (!tpl) {
              core.notice("No template title prefix recognized; labeling and closing.");
              await addLabel("invalid");
              const chooser = Object.keys(TEMPLATES).map(function (prefix) {
                const t = TEMPLATES[prefix];
                return "- `" + prefix.toUpperCase() + "` — [" + t.name + "](" + newIssueUrl(t) + ")";
              }).join("\n");
              const msg =
                "Thanks for opening an issue! I could not match it to one of our " +
                "issue templates (the title should start with `[BUG]`, `[FEATURE]`, " +
                "`[DOCS]`, or `[QUESTION]` and the body should contain that " +
                "template's sections).\n\n" +
                "This issue has been closed. Editing it does not reopen it — " +
                "please open a new issue through one of the forms:\n\n" + chooser + "\n\n" +
                "Maintainer-authored issues are exempt from this check.";
              await commentOnce(msg);
              await closeAsNotPlanned();
              return;
            }

            const missing = missingSections(tpl);
            if (missing.length === 0) {
              core.notice("Issue follows the " + tpl.name + " template.");
              await addLabel(tpl.label);
              await removeLabelSafely("invalid");
              return;
            }

            core.notice("Missing required sections: " + missing.join(", "));
            await addLabel("invalid");
            const msg =
              "Thanks for opening an issue! This one was created outside the " +
              "[" + tpl.name + "](" + newIssueUrl(tpl) + ") form: I could not find " +
              "the required section(s) " + missing.map(function (h) {
                return "`### " + h + "`";
              }).join(", ") + " in the body.\n\n" +
              "This issue has been closed. Editing it does not reopen it — " +
              "please open a new issue through the [" + tpl.name + "](" + newIssueUrl(tpl) + ") " +
              "form and include the missing sections.\n\n" +
              "Maintainer-authored issues are exempt from this check.";
            await commentOnce(msg);
            await closeAsNotPlanned();
