name: ✨ Feature Request
description: Suggest an idea or enhancement for Meetily
title: '[FEATURE] '
labels: ['enhancement']
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Before submitting, please [search existing feature requests](https://github.com/xyzzyy/meetily/issues?q=is%3Aissue%20label%3Aenhancement) and upvote existing ones instead of opening duplicates.

  - type: markdown
    attributes:
      value: >
        Describe the problem, why it matters, and the result you want. Keep solution choices open. Do not add acceptance criteria, completion checklists, or new requirements unless the requester supplied them. Present possible approaches as ideas. Do not turn prior art into requirements.

  - id: feature-description
    type: textarea
    attributes:
      label: Feature Description
      description: >
        Describe the problem this feature would solve, why it matters, and the result you want.
        Possible approaches are optional ideas, not requirements.
    validations:
      required: true

  - id: upstream-work
    type: textarea
    attributes:
      label: Upstream Work & Prior Art
      description: >
        Related upstream issues/PRs (e.g. on Zackriya-Solutions/meeting-minutes) and prior art in other
        tools. Letting an AI agent do this search is fine.
        If you found nothing, write "None found" — this field is required so please never leave it empty.
      placeholder: |
        - Upstream: <link to a related upstream issue/PR, or "None found">
        - Prior art: <other products/projects and what they do, or "None found">
    validations:
      required: true

  - id: additional-context
    type: textarea
    attributes:
      label: Additional Context & Notes
      description: Any other context, screenshots, or mockups about the feature request.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have described the issue clearly
          required: true
        - label: I have searched for similar feature requests
          required: true
        - label: I have included any relevant screenshots/mockups
