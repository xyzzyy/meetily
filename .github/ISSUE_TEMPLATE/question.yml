name: ❓ Question
description: Ask about usage, setup, or expected behavior
title: '[QUESTION] '
labels: ['question']
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Have a question about Meetily? A short form helps us help you faster.

  - type: markdown
    attributes:
      value: >
        Describe the problem, why it matters, and the result you want. Keep solution choices open. Do not add acceptance criteria, completion checklists, or new requirements unless the requester supplied them. Present possible approaches as ideas. Do not turn prior art into requirements.

  - id: goal
    type: textarea
    attributes:
      label: What are you trying to do?
      description: Describe your goal, not just the wall you hit (e.g. 'transcribe a 10-minute meeting on Windows with GPU acceleration').
    validations:
      required: true

  - id: tried
    type: textarea
    attributes:
      label: What have you already tried?
      description: Commands, settings and docs you tried, and what happened — include errors/logs in code blocks.
    validations:
      required: true

  - id: docs-consulted
    type: input
    attributes:
      label: Docs / Links You Consulted
      description: README or docs pages you already checked before asking (e.g. docs/ci.md).
    validations:
      required: false

  - id: environment
    type: input
    attributes:
      label: Environment (if relevant)
      description: OS + app version, e.g. 'Windows 11, v0.1.1'.
    validations:
      required: false

  - id: additional-context
    type: textarea
    attributes:
      label: Additional Context
      description: Logs, screenshots or anything else useful.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have described the issue clearly
          required: true
