name: 🐞 Bug Report
description: Report something that doesn't work as expected
title: '[BUG] '
labels: ['bug']
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Before submitting, please [search existing issues](https://github.com/xyzzyy/meetily/issues?q=is%3Aissue%20label%3Abug) to avoid duplicates.

  - type: markdown
    attributes:
      value: >
        Describe the problem, why it matters, and the result you want. Keep solution choices open. Do not add acceptance criteria, completion checklists, or new requirements unless the requester supplied them. Present possible approaches as ideas. Do not turn prior art into requirements.
        Keep the issue brief. Include only evidence and links that help explain or investigate this problem. Give each useful source a short note about its relevance. Omit search diaries, unrelated results, and repeated details. Distinguish observed behavior, source findings, and untested ideas. Agents must check the current code and merged work before calling a bug unresolved. Check a checklist item only when it is true. Put later progress updates and resolution details in comments. Keep the original problem or request in the issue body.

  - id: description
    type: textarea
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - id: current-behavior
    type: textarea
    attributes:
      label: Current Behavior
      description: >
        Describe the current behavior. Separate observed results from source findings.
        Put relevant error output in code blocks and identify output that is only quoted from the source.
      placeholder: |
        Paste error output between the fences below.
    validations:
      required: true

  - id: expected-behavior
    type: textarea
    attributes:
      label: Expected Behavior
      description: What you expected to happen instead.
    validations:
      required: true

  - id: steps
    type: textarea
    attributes:
      label: Steps to Reproduce
      description: >
        Give the known steps. If the bug was found by reading code and has not been reproduced, say so.
        Keep proposed reproduction steps separate from observed results.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - id: environment
    type: textarea
    attributes:
      label: Environment
      description: Replace the examples with your actual values and delete lines that don't apply.
      render: text
      placeholder: |
        - OS: [e.g. macOS 15.1 / Windows 11 / Ubuntu 24.04]
        - Hardware: [e.g. MacBook Pro (M3) / NVIDIA RTX 4090]
        - App Version: [e.g. v0.1.1]
        - Rust: [e.g. 1.99.1, only if building from source]
    validations:
      required: true

  - id: additional-context
    type: textarea
    attributes:
      label: Additional Context
      description: Any other context — screenshots, videos, related issues, or links.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have described the issue clearly
          required: true
        - label: I have searched for similar issues
          required: true
        - label: I have included error messages (if applicable)
